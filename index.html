<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT Workplace Language Guide</title><style>*{box-sizing:border-box}body{margin:0;background:#080305;color:#fff1f4;font-family:system-ui;line-height:1.55}header{text-align:center;padding:48px 18px;background:radial-gradient(circle,#5b0a1e55,transparent 55%)}h1{font-size:clamp(2rem,6vw,4rem)}.rose{color:#ff6b8d;text-shadow:0 0 25px #d72f5966}.sub{color:#c6aeb5;max-width:800px;margin:auto}nav{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow:auto;padding:10px;background:#080305dd;backdrop-filter:blur(16px);border-bottom:1px solid #ff5c8040}button,input{background:#26091499;color:#fff1f4;border:1px solid #ff5c8040;border-radius:12px;padding:10px 13px}button{white-space:nowrap}button:hover,input:focus{border-color:#ff6b8d;box-shadow:0 0 18px #d72f5944;outline:0}main{max-width:1180px;margin:auto;padding:24px 16px 70px}.bar{display:flex;gap:10px}.search{flex:1}.section{margin:44px 0}.section h2{color:#ff6b8d;text-shadow:0 0 16px #ff6b8d44}.muted{color:#c6aeb5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}.card{background:linear-gradient(145deg,#300a1699,#0f050ab3);border:1px solid #ff5c8033;border-radius:18px;padding:18px;backdrop-filter:blur(15px);box-shadow:0 12px 35px #0008,inset 0 1px #fff1}.num{color:#d72f59;font-weight:800}.term{font-size:1.12rem;font-weight:800;margin:5px 0 10px}.label{color:#b98b96;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;margin-top:10px}.ex{color:#e1cbd1;font-style:italic}.tag{display:inline-block;margin-top:10px;padding:4px 8px;border:1px solid #ff6b8d44;border-radius:999px;color:#ffb0c2}footer{text-align:center;color:#c6aeb5;padding:30px}</style></head><body><header><h1><span class="rose">IT</span> Workplace Language Guide</h1><p class="sub">Understand what IT people say, what it means at work, and the technical language behind it.</p></header><nav></nav><main><div class="bar"><input id="search" class="search" placeholder="Search phrases, terms, tools, roles..."><span id="count"></span></div><div id="content"></div></main><footer>Blood Rose Edition · 30 pages × 10 contents = 300 entries</footer><script>const data=[["Work & Tasks",["What’s on your plate?","What are you working on?","Can you take this up?","Can you pick this up?","Are you on this?","Who owns this?","I’ll take this.","Can you own this?","What’s your priority?","What should I pick up next?"]],["Updates & Communication",["Keep me posted.","Keep me in the loop.","Loop me in.","Give me a heads-up.","Any updates?","Where are we on this?","What’s the status?","I’ll get back to you.","I’ll follow up.","I’ll keep you updated."]],["Meetings & Collaboration",["Let’s sync.","Let’s connect.","Let’s touch base.","Let’s align.","Let’s take this offline.","Let’s park this.","Let’s circle back.","Are we aligned?","Any thoughts?","Does that make sense?"]],["Problems & Blockers",["Any blockers?","What’s holding this up?","I’m stuck.","I’m blocked.","Can you look into this?","Can you check this?","Something’s not working.","Let’s troubleshoot this.","Can you reproduce it?","Let’s escalate this."]],["Deadlines & Workload",["What’s the ETA?","Is this on track?","We’re running behind.","Can we move this up?","Can we push this back?","I’ll have it by EOD.","Do you have bandwidth?","I’m tied up.","I’m swamped.","Let’s reprioritize."]],["Ownership & Handoffs",["Take ownership.","I’ll own this.","I’ll hand this over.","Can you take it from here?","It’s pending from them.","We’re waiting on them.","Let’s bring them in.","Who’s the point of contact?","Let’s hand this off.","I’ll take it from here."]],["Client & Corporate Language",["Let’s manage expectations.","That’s outside the scope.","Let’s factor that in.","Let’s streamline this.","Let’s leverage this.","Let’s keep it simple.","Let’s not overcomplicate this.","Raise this.","Flag this.","We need more clarity."]],["Digital Workplace",["Ping me.","Drop me a message.","Send it over.","Tag me.","I’ll DM you.","Check the thread.","Share the link.","Drop the details here.","Move this to a call.","I’ll send an update."]],["Stand-up Language",["What did you work on?","What are you working on today?","Any blockers?","Nothing blocking me.","I’ll pick this up today.","I’ll continue this today.","I’m almost done.","I’m waiting on X.","I’ll carry this over.","I’ll close this today."]],["Phrase → Action",["Look into it.","Follow up.","Close the loop.","Move this forward.","Unblock this.","Drive this.","Track this.","Action this.","Flag this.","Escalate this."]],["IT Fundamentals",["Hardware","Software","Operating system","CPU","RAM","Storage","Process","Application","File system","Terminal"]],["Programming & Development",["Source code","Programming language","Variable","Function","Library","Framework","Bug","Debugging","Build","Dependency"]],["Git & Version Control",["Git","Repository","Commit","Branch","Merge","Pull request","Clone","Pull","Push","Conflict"]],["Web & APIs",["Frontend","Backend","Client","Server","API","Endpoint","HTTP","HTTPS","JSON","Authentication"]],["Databases & SQL",["Database","Table","Row / Record","Column / Field","SQL","Query","Primary key","Index","Transaction","NoSQL"]],["Networking",["IP address","DNS","Router","Port","TCP","UDP","LAN","VPN","Firewall","Latency"]],["Cloud & DevOps",["Cloud computing","Deployment","Environment","Development","Staging","Production","CI","CD","Container","Kubernetes"]],["Cybersecurity",["Threat","Vulnerability","Risk","Encryption","MFA","Least privilege","Patch","Phishing","Incident","Audit log"]],["Data & AI",["Data","Dataset","Machine Learning","Model","Training","Inference","LLM","Prompt","RAG","Embedding"]],["UI/UX & Product",["UI","UX","Wireframe","Prototype","Component","Responsive design","Accessibility","User flow","Design system","Usability"]],["IT Tools & Applications",["VS Code","GitHub","GitLab","Jira","Confluence","Slack","Microsoft Teams","Figma","Postman","Docker"]],["IT Roles & Departments",["Software Developer","Frontend Developer","Backend Developer","Full-Stack Developer","QA Engineer","DevOps Engineer","UI/UX Designer","Product Manager","Project Manager","Business Analyst"]],["Core IT Abbreviations",["IT — Information Technology","CPU — Central Processing Unit","GPU — Graphics Processing Unit","RAM — Random Access Memory","SSD — Solid-State Drive","OS — Operating System","CLI — Command-Line Interface","GUI — Graphical User Interface","IDE — Integrated Development Environment","SDK — Software Development Kit"]],["Web & Networking Abbreviations",["URL — Uniform Resource Locator","URI — Uniform Resource Identifier","IP — Internet Protocol","DNS — Domain Name System","HTTP — Hypertext Transfer Protocol","HTTPS — HTTP Secure","TCP — Transmission Control Protocol","UDP — User Datagram Protocol","VPN — Virtual Private Network","CDN — Content Delivery Network"]],["Development & Delivery Abbreviations",["PR — Pull Request","CI — Continuous Integration","CD — Continuous Delivery / Deployment","QA — Quality Assurance","UAT — User Acceptance Testing","MVP — Minimum Viable Product","SLA — Service Level Agreement","SLO — Service Level Objective","SRE — Site Reliability Engineering","MTTR — Mean Time To Recovery / Repair"]],["File & Data Formats",["TXT","CSV","JSON","XML","YAML","HTML","CSS","JS","PDF","ZIP"]],["Testing & Quality",["Test case","Unit test","Integration test","End-to-end test","Regression","Smoke test","Test environment","Acceptance criteria","Quality gate","Defect report"]],["Operations & Reliability",["Incident","Outage","Alert","Metric","Log","Trace","Observability","Runbook","Postmortem","Root cause"]],["Software Architecture",["Architecture","Component","Service","Microservice","Monolith","Load balancer","Cache","Queue","Event","Scalability"]],["Professional IT Habits",["Document it","Leave a paper trail","Don’t assume","Verify before closing","Reproduce before fixing","Small changes are safer","Communicate early","Ask for context","Know the environment","Leave it better than you found it"]]],WM={"What’s on your plate?":"What work or responsibilities are you currently handling?","Can you take this up?":"Can you handle this task?","Keep me posted.":"Keep me updated.","Loop me in.":"Include me in the discussion or process.","Let’s sync.":"Let’s talk and make sure we are aligned.","Any blockers?":"Is anything preventing your progress?","What’s the ETA?":"When is the work expected to be ready?","Do you have bandwidth?":"Do you have enough time or capacity for more work?","Who owns this?":"Who is responsible for it?","Let’s circle back.":"Return to the topic later with an update."},TM={"Hardware":"Physical computer components.","Software":"Programs and instructions that run on hardware.","Operating system":"Core software that manages hardware and applications.","CPU":"Processor that executes instructions.","RAM":"Fast temporary memory used by active programs.","Storage":"Persistent space for data and files.","API":"Defined interface for software components to communicate.","Database":"System for storing and retrieving data.","Git":"Distributed version control system.","Repository":"Project storage containing files and version history.","Docker":"Platform for building and running containers.","Kubernetes":"Platform for orchestrating containerized workloads.","LLM":"Large Language Model used for language generation and transformation.","RAG":"Retrieval-Augmented Generation using retrieved context before generation."};const nav=document.querySelector('nav'),out=document.querySelector('#content'),search=document.querySelector('#search'),count=document.querySelector('#count');nav.innerHTML=data.map((s,i)=>`<button onclick="document.querySelector('#s${i}').scrollIntoView({behavior:'smooth'})">${String(i+1).padStart(2,'0')}</button>`).join('');function render(q=''){out.innerHTML='';let n=0;data.forEach((s,i)=>{let a=s[1].filter(x=>(s[0]+' '+x).toLowerCase().includes(q.toLowerCase()));if(!a.length)return;n+=a.length;let sec=document.createElement('section');sec.className='section';sec.id='s'+i;sec.innerHTML=`<h2>${String(i+1).padStart(2,'0')}. ${s[0]}</h2><p class="muted">10 practical entries.</p><div class="grid">${a.map((x,j)=>{let m=WM[x]||TM[x]||'A practical IT term or workplace concept used in this area.';let type=i<10?'In IT / workplace':'What it means';return `<article class="card"><div class="num">${String(i+1).padStart(2,'0')}.${String(j+1).padStart(2,'0')}</div><div class="term">${x}</div><div class="label">${type}</div><div>${m}</div><div class="label">Example / usage</div><div class="ex">“${x}”</div><span class="tag">${i<10?'Workplace language':'IT terminology'}</span></article>`}).join('')}</div>`;out.appendChild(sec)});count.textContent=n+' entries'}render();search.oninput=e=>render(e.target.value);</script></body></html>
