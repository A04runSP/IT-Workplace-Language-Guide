const workplaceMeanings={"What’s on your plate?":"What tasks, tickets or responsibilities are currently assigned to you?","What are you working on?":"What task or workstream are you currently handling?","Can you take this up?":"Can you take responsibility for this task and work on it?","Can you pick this up?":"Can you start handling this task from here?","Are you on this?":"Are you currently responsible for or working on this item?","Who owns this?":"Who is the person responsible for getting this task completed?","I’ll take this.":"I will take responsibility for this task.","Can you own this?":"Can you become the accountable person for this work?","What’s your priority?":"Which task should receive your attention first?","What should I pick up next?":"Which available task should I work on after my current work?","Keep me posted.":"Send me updates as the work progresses or the situation changes.","Keep me in the loop.":"Continue including me in relevant updates and decisions.","Loop me in.":"Add me to the conversation, communication or decision-making process.","Give me a heads-up.":"Tell me in advance if something important is about to happen or change.","Any updates?":"Has there been any meaningful progress or change since the last update?","Where are we on this?":"What is the current progress or status of this work?","What’s the status?":"What is the current state of the task, issue or project?","I’ll get back to you.":"I need time to check something and will respond later.","I’ll follow up.":"I will contact the relevant person or revisit the item to get an answer or progress.","I’ll keep you updated.":"I will continue sharing important progress or changes.","Let’s sync.":"Let’s have a short discussion to compare information and align.","Let’s connect.":"Let’s talk directly to discuss the topic or coordinate work.","Let’s touch base.":"Let’s have a brief check-in about the current situation.","Let’s align.":"Let’s make sure everyone has the same understanding, goal or decision.","Let’s take this offline.":"Let’s move this detailed discussion out of the current meeting or public thread.","Let’s park this.":"Let’s temporarily set this topic aside and return to it later.","Let’s circle back.":"Let’s return to this topic later after getting more information or progress.","Are we aligned?":"Do we all agree on the goal, decision, scope or next step?","Any thoughts?":"Do you have an opinion, suggestion or concern about this approach?","Does that make sense?":"Is the explanation, requirement or plan clear to you?","Any blockers?":"Is anything currently preventing you from making progress?","What’s holding this up?":"What dependency, problem or decision is delaying the work?","I’m stuck.":"I cannot make progress because I need information, a decision or a solution.","I’m blocked.":"Something outside my immediate control is preventing progress.","Can you look into this?":"Can you investigate the issue and find out what is happening?","Can you check this?":"Can you verify the information, behavior or result?","Something’s not working.":"The expected behavior is failing and needs investigation.","Let’s troubleshoot this.":"Let’s systematically investigate the problem and identify a fix.","Can you reproduce it?":"Can you make the same problem happen consistently so we can investigate it?","Let’s escalate this.":"Let’s involve a higher-level owner or specialist because the current path is insufficient.","What’s the ETA?":"What is the expected time or date for completion?","Is this on track?":"Is the work progressing according to the planned schedule?","We’re running behind.":"The work is later than the planned schedule or milestone.","Can we move this up?":"Can we give this higher priority or complete it earlier?","Can we push this back?":"Can we move the deadline or activity to a later time?","I’ll have it by EOD.":"I expect to complete or deliver it by the end of the working day.","Do you have bandwidth?":"Do you have enough available time or capacity to take on more work?","I’m tied up.":"I am currently occupied with other work and have limited availability.","I’m swamped.":"I have a very high workload and limited capacity right now.","Let’s reprioritize.":"Let’s reorder the work based on current urgency and business value.","Take ownership.":"Become accountable for coordinating and completing the work.","I’ll own this.":"I will be accountable for this item and its outcome.","I’ll hand this over.":"I will transfer responsibility and relevant context to another person or team.","Can you take it from here?":"Can you continue the work from the current point and handle the next steps?","It’s pending from them.":"Progress depends on an action, answer or deliverable from another person or team.","We’re waiting on them.":"Our work cannot continue fully until another person or team responds or delivers something.","Let’s bring them in.":"Let’s involve the person or team whose knowledge or action is needed.","Who’s the point of contact?":"Who is the primary person to contact for this topic or responsibility?","Let’s hand this off.":"Let’s transfer the task and its context to the next responsible person or team.","I’ll take it from here.":"I will continue the work and handle the remaining steps.","Let’s manage expectations.":"Let’s communicate realistic scope, timing and outcomes so others know what to expect.","That’s outside the scope.":"That request is not included in the agreed work or requirements.","Let’s factor that in.":"Let’s consider that requirement, risk or constraint when deciding what to do.","Let’s streamline this.":"Let’s simplify the process by removing unnecessary steps or complexity.","Let’s leverage this.":"Let’s make practical use of this existing resource, capability or information.","Let’s keep it simple.":"Let’s choose the clearest solution without unnecessary complexity.","Let’s not overcomplicate this.":"Avoid adding complexity that does not provide enough value.","Raise this.":"Bring the issue, risk or request to the appropriate person or forum for attention.","Flag this.":"Mark or communicate the item as something that needs attention or awareness.","We need more clarity.":"The requirements, ownership, expected outcome or context is not clear enough yet.","Ping me.":"Send me a quick message when you need my attention.","Drop me a message.":"Send me a short written message through the relevant communication tool.","Send it over.":"Send the requested file, information, link or result to me.","Tag me.":"Mention me in the relevant tool so I receive the context or notification.","I’ll DM you.":"I will send you a direct private message.","Check the thread.":"Review the existing conversation because the context or decision is already there.","Share the link.":"Provide the URL so others can access the relevant resource.","Drop the details here.":"Put the required information into the current chat, ticket or thread.","Move this to a call.":"Switch from written discussion to a meeting because direct discussion may be faster.","I’ll send an update.":"I will communicate the latest progress, result or change.","What did you work on?":"Briefly describe the work you completed or progressed during the reporting period.","What are you working on today?":"State the task or priority you plan to work on today.","Nothing blocking me.":"I currently have no issue or dependency preventing progress.","I’ll pick this up today.":"I will start or continue this task during today’s work.","I’ll continue this today.":"I will keep progressing this item during today’s work.","I’m almost done.":"The task is close to completion but still has remaining work or checks.","I’m waiting on X.":"My progress currently depends on a person, team or external input represented by X.","I’ll carry this over.":"The unfinished task will move into the next work period rather than being closed now.","I’ll close this today.":"I expect to finish the remaining work and mark the item complete today.","Look into it.":"Investigate the situation and return with useful findings.","Follow up.":"Contact the relevant party or revisit the item to obtain progress or an answer.","Close the loop.":"Finish the communication cycle by confirming the result with everyone who needs to know.","Move this forward.":"Take the next practical action needed to make progress.","Unblock this.":"Remove the dependency or obstacle preventing progress.","Drive this.":"Actively coordinate the work, follow-ups and decisions needed to move it to completion.","Track this.":"Monitor progress, status or changes until the item is resolved.","Action this.":"Turn the discussion or decision into a concrete task or next step.","Escalate this.":"Move the issue to a higher-level owner or specialist when the current path cannot resolve it."};

ge language model trained to understand and generate human-like text.","Prompt":"The instruction or input supplied to an AI model to guide its response.","RAG":"Retrieval-augmented generation, where relevant external information is retrieved before generation.","Embedding":"A numerical vector representation used to capture semantic relationships between data items.","UI":"The visible interface through which a user interacts with a digital product.","UX":"The overall quality and effectiveness of a user's experience with a product or service.","Wireframe":"A low-detail layout used to plan screen structure and content placement.","Prototype":"An interactive or visual representation used to test an idea before full implementation.","Component":"A reusable UI or software building block with a defined purpose and interface.","Responsive design":"Designing interfaces so layouts adapt to different screen sizes and devices.","Accessibility":"Designing products so people with different abilities can use them effectively.","User flow":"The sequence of steps a user follows to complete a goal in a product.","Design system":"A shared set of components, rules and design tokens used for consistent product design.","Usability":"How easily and effectively users can learn and accomplish tasks with a product.","VS Code":"A source-code editor commonly used for programming, debugging and extensions.","GitHub":"A platform for hosting Git repositories and collaborating through issues, reviews and automation.","GitLab":"A DevOps platform combining Git repositories with planning, CI/CD and security capabilities.","Jira":"A project and issue-tracking tool commonly used to plan and manage development work.","Confluence":"A collaborative workspace used to create and organize team documentation.","Slack":"A team messaging platform organized around conversations, channels and integrations.","Microsoft Teams":"A collaboration platform combining chat, meetings, files and teamwork features.","Figma" t-based interface where users operate software by entering commands.","GUI — Graphical User Interface":"A visual interface using elements such as windows, menus, buttons and icons.","IDE — Integrated Development Environment":"A development application combining editing, debugging and other programming tools.","SDK — Software Development Kit":"A collection of tools, libraries and documentation for building software for a platform.","URL — Uniform Resource Locator":"An address that identifies where a resource can be accessed on a network.","URI — Uniform Resource Identifier":"A standardized identifier for a resource, whether or not it provides a location.","IP — Internet Protocol":"The network protocol responsible for addressing and routing packets.","DNS — Domain Name System":"The system that maps human-readable domain names to network records.","HTTP — Hypertext Transfer Protocol":"The application protocol used for exchanging web requests and responses.","HTTPS — HTTP Secure":"HTTP communication protected by TLS encryption.","TCP — Transmission Control Protocol":"A reliable, ordered transport protocol used by many internet applications.","UDP — User Datagram Protocol":"A connectionless transport protocol suited to low-overhead, time-sensitive communication.","VPN — Virtual Private Network":"A technology that creates an encrypted network tunnel across another network.","CDN — Content Delivery Network":"A distributed network that serves content from locations closer to users.","PR — Pull Request":"A request to review and merge a set of code changes.","CI — Continuous Integration":"The practice of frequently integrating changes and automatically validating them.","CD — Continuous Delivery / Deployment":"Automating software release preparation or deployment after validation.","QA — Quality Assurance":"The discipline of preventing and detecting defects through planned quality practices.","UAT — User Acceptance Testing":"Testing by representative users or stakeholders to ent":"A controlled setup where software can be tested without affecting live users.","Acceptance criteria":"Specific conditions that a feature must satisfy to be considered complete.","Quality gate":"A defined checkpoint that must pass before work can move to the next delivery stage.","Defect report":"A record describing a software problem, its evidence, impact and reproduction steps.","Incident":"An event that disrupts or threatens normal service operation and requires response.","Outage":"A period when a service or system is unavailable or significantly degraded.","Alert":"An automated notification that a monitored condition needs attention.","Metric":"A numerical measurement used to understand system, product or business behavior.","Log":"A timestamped record of events produced by software or infrastructure.","Trace":"A record showing how a request travels through components or services.","Observability":"The ability to understand internal system behavior from outputs such as logs, metrics and traces.","Runbook":"A documented procedure for handling a known operational task or incident.","Postmortem":"A structured review after an incident to understand causes and improve future resilience.","Root cause":"The underlying reason a problem occurred rather than only its visible symptom.","Architecture":"The high-level structure of a software system and how its major parts interact.","Component":"A distinct reusable part of a system with a defined responsibility and interface.","Service":"A software capability exposed for other components, users or systems to consume.","Microservice":"A small independently deployable service focused on a specific business capability.","Monolith":"An application delivered as one integrated deployment unit.","Load balancer":"A component that distributes incoming traffic across multiple servers or instances.","Cache":"A faster temporary data store used to reduce repeated computation or access latency.","Queue":"A mechanism that holds work or messages until another component can process them.","Event":"A record or signal that something significant happened in a system.","Scalability":"The ability of a system to handle increased workload by adding or improving resources.","Document it":"Record important decisions, procedures and context so others can understand or reproduce the work.","Leave a paper trail":"Keep useful written evidence of decisions, changes and communication for future reference.","Don’t assume":"Verify requirements, environment and facts instead of relying on an untested belief.","Verify before closing":"Confirm the requested result actually works before marking the task complete.","Reproduce before fixing":"Observe and reproduce a defect so the fix targets the real cause.","Small changes are safer":"Prefer focused changes that are easier to review, test, roll back and troubleshoot.","Communicate early":"Raise risks, blockers or changing expectations before they become larger problems.","Ask for context":"Understand the goal and constraints before deciding how to implement something.","Know the environment":"Confirm whether you are working in development, staging or production and understand its rules.","Leave it better than you found it":"Improve clarity, documentation, reliability or maintainability when making a change."};

function escapeHtml(value){return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));}
function meaningFor(section,term,index){if(index<10&&workplaceMeanings[term])return workplaceMeanings[term];if(technicalMeanings[term])return technicalMeanings[term];return `In IT, this ${section.toLowerCase()} item is used by the team to perform, manage or communicate this part of the work.`;}
function exampleFor(section,term){return (exampleBySection[section]||'“TERM” is used in the IT workflow.').replace('TERM',term);}
const nav=document.getElementById('nav'),out=document.getElementById('content'),search=document.getElementById('search'),count=document.getElementById('count');
nav.innerHTML=data.map((s,i)=>`<button onclick="document.getElementById('s${i}').scrollIntoView()">${String(i+1).padStart(2,'0')}</button>`).join('');
function render(q=''){out.innerHTML='';let total=0;data.forEach((s,i)=>{const matches=s[1].map((term,j)=>({term,j})).filter(o=>(s[0]+' '+o.term+' '+meaningFor(s[0],o.term,i)).toLowerCase().includes(q.toLowerCase()));if(!matches.length)return;total+=matches.length;const sec=document.createElement('section');sec.className='section';sec.id='s'+i;sec.innerHTML=`<h2>${String(i+1).padStart(2,'0')}. ${escapeHtml(s[0])}</h2><p class="muted">${i<10?'Workplace language: understand the indirect meaning and the action behind it.':'Technical language: understand the concept, purpose and practical use.'}</p><div class="grid">${matches.map(o=>{const type=i<10?'In IT / workplace':'What it means';const tag=i<10?'Workplace language':'IT terminology';return `<article class="card"><div class="num">${String(i+1).padStart(2,'0')}.${String(o.j+1).padStart(2,'0')}</div><div class="term">${escapeHtml(o.term)}</div><div class="label">${type}</div><div class="meaning">${escapeHtml(meaningFor(s[0],o.term,i))}</div><div class="label">Example / usage</div><div class="ex">${escapeHtml(exampleFor(s[0],o.term))}</div><span class="tag">${tag}</span></article>`}).join('')}</div>`;out.appendChild(sec);});count.textContent=total+' entries';}
render();search.addEventListener('input',e=>render(e.target.value));
</script>
